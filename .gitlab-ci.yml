stages:
  - check
  - publish

# uv derives these names from the index named `nn-mcp` in pyproject.toml.
variables:
  UV_INDEX_NN_MCP_USERNAME: gitlab-ci-token
  UV_INDEX_NN_MCP_PASSWORD: ${CI_JOB_TOKEN}

.check:
  stage: check
  image: ghcr.io/astral-sh/uv:0.12.10-python${PYVER}-trixie
  script:
    - uv sync --all-extras
    - uv format --check --version 0.15.22
    - uv run pytest

check:3.12:
  extends: .check
  variables:
    PYVER: "3.12"

check:3.13:
  extends: .check
  variables:
    PYVER: "3.13"

check:3.14:
  extends: .check
  variables:
    PYVER: "3.14"

# Publishing is per project; installing is per group. Every push to master
# publishes, and the registry refuses a version it already holds with
# `400 Bad request - Validation failed: File name has already been taken`.
# That is the expected answer to "nothing changed", so it is tolerated and
# any other failure is still a failure.
publish:
  stage: publish
  image: ghcr.io/astral-sh/uv:0.12.10-python3.12-trixie
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  script:
    - uv build --wheel
    - |
      set +e
      output=$(uv publish \
        --publish-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi" \
        --username gitlab-ci-token \
        --password "${CI_JOB_TOKEN}" 2>&1)
      status=$?
      echo "$output"
      if [ $status -ne 0 ]; then
        echo "$output" | grep -q "File name has already been taken" || exit $status
        echo "This version is already published -- nothing to do."
      fi

[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nn-mcp-stdio"
authors = [
    { name = "Frederik Schumacher" },
]
version = "0.1.0"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
# description is read from src/nn_mcp_stdio/__init__.py's module docstring by
# flit.
dynamic = ["description"]
# The sibling MCP types and the sibling RFC 6570 router (editable path installs
# for now, `pip install -e ../nn-mcp-types ../nn-rfc6570-router`), the aiojobs
# background-task scheduler, and jsonschema for strict argument validation
# (Draft202012Validator).
dependencies = [
    "nn-mcp-types",
    "nn-rfc6570-router",
    "aiojobs>=1.4",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
dev = [
    "black>=24",
    "nn-semver @ git+https://github.com/fre-sch/nn-semver@master"
]

[tool.flit.module]
# Distribution name is nn-mcp-stdio; import name is nn_mcp_stdio under src/.
name = "nn_mcp_stdio"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 80

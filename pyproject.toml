[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nn-mcp-stdio"
authors = [
    { name = "Frederik Schumacher" },
]
version = "1.0.0"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.15"
dynamic = ["description"]
dependencies = [
    "nn-mcp-types>=1.0",
    "nn-rfc6570-router>=1.0",
    "aiojobs>=1.4",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
dev = ["nn-semver>=1.0"]

[project.urls]
Repository = "https://gitlab.com/freschu/nn-mcp/nn-mcp-stdio"

# `explicit = true` confines this index to the names pinned to it below, and a
# pinned name is looked up nowhere else -- PyPI included. aiojobs and
# jsonschema resolve from PyPI as usual.
#
# Sources are not inherited from a dependency's metadata: nn-mcp-types asks
# for `dc_schema>=1.2` and nothing more, so dc_schema has to be pinned here
# too even though this package never imports it. Every consumer pins the
# whole transitive closure of our own packages, or the fork's name resolves
# to the upstream one on PyPI.
[[tool.uv.index]]
name = "nn-mcp"
url = "https://gitlab.com/api/v4/groups/141518299/-/packages/pypi/simple"
explicit = true

[tool.uv.sources]
dc_schema = { index = "nn-mcp" }
nn-mcp-types = { index = "nn-mcp" }
nn-rfc6570-router = { index = "nn-mcp" }
nn-semver = { index = "nn-mcp" }

[tool.flit.module]
# Distribution name is nn-mcp-stdio; import name is nn_mcp_stdio under src/.
name = "nn_mcp_stdio"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 80

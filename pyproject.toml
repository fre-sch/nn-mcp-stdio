[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nn-mcp-stdio"
authors = [
    { name = "Frederik Schumacher" },
]
version = "1.0.0"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.15"
dynamic = ["description"]
dependencies = [
    "nn-mcp-types>=1.1",
    "nn-rfc6570-router>=1.0",
    "aiojobs>=1.4",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
dev = ["nn-semver>=1.0"]

[project.urls]
Repository = "https://gitlab.com/freschu/nn-mcp/nn-mcp-stdio"

# Where our own packages come from. Every name we publish is unique to us --
# nothing on PyPI claims `nn-dc-schema`, `nn-mcp-types`, `nn-rfc6570-router`
# or `nn-semver` -- so this is an additional index, not a restricted one.
#
# It must not be `explicit`: uv applies `[tool.uv.sources]` only to a
# project's direct dependencies, so an explicit index is never searched for
# a transitive one, and the graph fails to resolve.
[[tool.uv.index]]
name = "nn-mcp"
url = "https://gitlab.com/api/v4/groups/141518299/-/packages/pypi/simple"

[tool.flit.module]
# Distribution name is nn-mcp-stdio; import name is nn_mcp_stdio under src/.
name = "nn_mcp_stdio"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 80

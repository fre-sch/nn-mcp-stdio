[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nn-mcp-stdio"
authors = [
    { name = "Frederik Schumacher" },
]
version = "1.0.0"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dynamic = ["description"]
dependencies = [
    "nn-mcp-types @ git+https://github.com/fre-sch/nn-mcp-types@master",
    "nn-rfc6570-router @ git+https://github.com/fre-sch/nn-rfc6570-router@master",
    "aiojobs>=1.4",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
dev = [
    "black>=24",
    "nn-semver @ git+https://github.com/fre-sch/nn-semver@master"
]

[tool.flit.module]
# Distribution name is nn-mcp-stdio; import name is nn_mcp_stdio under src/.
name = "nn_mcp_stdio"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 80

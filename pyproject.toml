[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nn-mcp-stdio"
authors = [
    { name = "Frederik Schumacher" },
]
version = "1.5.0"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.15"
dynamic = ["description"]
dependencies = [
    "nn-mcp-types>=2.2",
    "nn-rfc6570-router>=1.0",
    "aiojobs>=1.4",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
dev = ["nn-semver>=1.0"]

[project.urls]
Repository = "https://gitlab.com/freschu/nn-mcp/nn-mcp-stdio"

# The only index. It serves our own packages and forwards every other name to
# PyPI, so PyPI is never declared beside it -- no tool can pin a transitive
# dependency to an index, one index that forwards makes that unnecessary.
# Not `explicit`, no `[tool.uv.sources]`. See the wiki decision
# gitlab-package-registry.
[[tool.uv.index]]
name = "nn-mcp"
url = "https://gitlab.com/api/v4/groups/141518299/-/packages/pypi/simple"
default = true

[tool.flit.module]
# Distribution name is nn-mcp-stdio; import name is nn_mcp_stdio under src/.
name = "nn_mcp_stdio"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 80
